<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="mfalme dot zero. Systems, platform, automation. Please let me.">
  <title>mfalme·0 — systems, platform, automation</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B16"/>
      <stop offset="45%" stop-color="#150F33"/>
      <stop offset="100%" stop-color="#2C0E36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="45%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.88" cy="0.12" r="0.62">
      <stop offset="0%" stop-color="#E879F9" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.08" cy="0.95" r="0.6">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glowA)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glowB)"/>

  <g transform="rotate(18 600 170)">
    <rect x="-360" y="-200" width="260" height="740" fill="url(#sheen)" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" dur="5.2s" begin="0.6s" repeatCount="3" keyTimes="0;0.12;0.75;1"/>
      <animateTransform attributeName="transform" type="translate" values="-160 0;1560 0" dur="5.2s" begin="0.6s" repeatCount="3"/>
    </rect>
  </g>

  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent)"/>

  <g font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <circle cx="60" cy="52" r="6" fill="#FF5F57"/>
    <circle cx="82" cy="52" r="6" fill="#FEBC2E"/>
    <circle cx="104" cy="52" r="6" fill="#28C840"/>
    <text x="132" y="59" font-size="17" fill="#7C8AA5" letter-spacing="1.5">~/operating-system</text>

    <text x="58" y="168" font-size="92" font-weight="700" fill="#FFFFFF" letter-spacing="-3">mfalme<tspan fill="url(#accent)">·0</tspan></text>

    <text x="60" y="228" font-size="25" fill="url(#prompt)">$</text>
    <text x="82" y="228" font-size="25" fill="#E6EAF2">please let me build your infrastructure</text>
    <rect x="710" y="207" width="14" height="27" rx="2" fill="#22D3EE">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite" keyTimes="0;0.5;0.5;1"/>
    </rect>

    <text x="60" y="288" font-size="16" fill="#8B97AD" letter-spacing="2.6">GO · PYTHON · TYPESCRIPT · DOCKER · NAIROBI · 03:00</text>
    <text x="1140" y="288" font-size="16" fill="#8B97AD" text-anchor="end" letter-spacing="2.6">EST. 2020</text>
  </g>
</svg>