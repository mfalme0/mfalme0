<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Terminal session: whoami shows mfalme0 in Nairobi; cat bio.md reads not as smart as iamtyroon or fideliskaruri, so please let me; ship.sh production reports everything still up.">
  <title>~/first-contact</title>
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B16"/>
      <stop offset="60%" stop-color="#140F30"/>
      <stop offset="100%" stop-color="#1E1030"/>
    </linearGradient>
    <pattern id="wgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <clipPath id="c1"><rect x="44" y="78" width="92" height="26"><animate attributeName="width" values="0;92" dur="0.35s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="44" y="108" width="266" height="26"><animate attributeName="width" values="0;266" dur="1.1s" begin="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="44" y="138" width="133" height="26"><animate attributeName="width" values="0;133" dur="0.6s" begin="2.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="44" y="168" width="490" height="26"><animate attributeName="width" values="0;490" dur="2.2s" begin="3.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="44" y="198" width="184" height="26"><animate attributeName="width" values="0;184" dur="1.0s" begin="6.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="44" y="228" width="255" height="26"><animate attributeName="width" values="0;255" dur="1.2s" begin="7.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c7"><rect x="44" y="258" width="235" height="26"><animate attributeName="width" values="0;235" dur="1.3s" begin="9.0s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="900" height="300" rx="16" fill="url(#win)"/>
  <rect width="900" height="300" rx="16" fill="url(#wgrid)"/>
  <rect x="0" y="0" width="900" height="3" rx="2" fill="#7C3AED"/>

  <circle cx="46" cy="36" r="6" fill="#FF5F57"/>
  <circle cx="68" cy="36" r="6" fill="#FEBC2E"/>
  <circle cx="90" cy="36" r="6" fill="#28C840"/>
  <text x="114" y="43" font-size="15" fill="#6B7A94" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">~/first-contact</text>

  <g font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">
    <g clip-path="url(#c1)"><text x="48" y="95"><tspan fill="#4ADE80">$</tspan><tspan fill="#7C8AA5"> whoami</tspan></text></g>
    <g clip-path="url(#c2)"><text x="48" y="125" fill="#CBD5E1">mfalme0 · nairobi · UTC+3</text></g>
    <g clip-path="url(#c3)"><text x="48" y="155"><tspan fill="#4ADE80">$</tspan><tspan fill="#7C8AA5"> cat bio.md</tspan></text></g>
    <g clip-path="url(#c4)"><text x="48" y="185" fill="#CBD5E1">not as smart as @iamtyroon or @fideliskaruri.</text></g>
    <g clip-path="url(#c5)"><text x="48" y="215" fill="#E879F9" font-weight="700">so please let me.</text></g>
    <g clip-path="url(#c6)"><text x="48" y="245"><tspan fill="#4ADE80">$</tspan><tspan fill="#7C8AA5"> ./ship.sh --production</tspan></text></g>
    <g clip-path="url(#c7)"><text x="48" y="275"><tspan fill="#4ADE80">✓</tspan><tspan fill="#CBD5E1">  everything still up</tspan></text></g>
  </g>

  <rect x="292" y="258" width="13" height="22" rx="2" fill="#22D3EE">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.05s" repeatCount="indefinite" keyTimes="0;0.5;0.5;1"/>
  </rect>
</svg>